<article class="article-card">
  <button class="article-card-toggle" type="button" aria-expanded="false">
    <img class="article-card-thumb" src="{{ img }}" alt="" />
    <span class="body-regular">{{ title }}</span>
    <time class="body-small" datetime="{{ datetime }}">{{ date }}</time>
  </button>

  <div class="article-card-open" hidden>
    <div class="article-card-content">
      <header class="article-card-header">
        <h4 class="h4-extrabold">{{ title }}</h4>
        <p class="body-small">{{ meta }}</p>
      </header>
      <p class="body-regular">{{ text }}</p>
      <a class="btn btn--read-more-small body-small" href="{{ link }}"
        >Read more</a
      >
    </div>
    <img class="article-card-img" src="{{ img }}" alt="" />
  </div>
</article>
