<label class="theme-switch">
  <input
    type="checkbox"
    class="theme-switch__input"
    role="switch"
    aria-label="Activer le mode sombre"
  />

  <span class="theme-switch__slider">
    <span class="theme-switch__thumb">
      <!-- Soleil -->
      <icon class="theme-switch__sun" src="assets/icons/switch-sun.svg"></icon>

      <!-- Lune -->
      <icon
        class="theme-switch__moon"
        src="assets/icons/switch-moon.svg"
      ></icon>
    </span>
  </span>
</label>
