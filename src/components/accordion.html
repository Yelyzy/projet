<div class="acc-item {{ open }}">
  <button
    type="button"
    class="h4-extrabold"
    aria-expanded="false"
  >
    <span>{{ question }}</span>
    <span class="acc-icon" aria-hidden="true"></span>
  </button>

  <div class="acc-panel" inert>
    <div class="acc-content">
      <p class="acc-answer body-regular">{{ answer }}</p>
    </div>
  </div>
</div>
